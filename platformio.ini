[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

; ----------------- Build Flags -----------------
; Include paths for our headers
build_flags =
    -I include
    -I src

; ----------------- Lib Dependencies -----------------
; You can add any PlatformIO libraries here
; For example, Wire is built-in, FlexCAN_T4 is from PlatformIO registry
lib_deps =
    greiman/FlexCAN_T4@^1.3.1
    adafruit/Adafruit BusIO@^1.14.1

; Optional: specify custom src_dir and include_dir (default is src and include)
; src_dir = src
; include_dir = include
